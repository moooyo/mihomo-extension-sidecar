name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this as its gate. A called workflow has to say so
  # explicitly, and without it the caller does not fail a job — it fails to
  # parse, producing a run with no jobs at all.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # The race detector is what catches the concurrent bundle-store and
      # control-server interleavings the plain suite runs straight past.
      - name: go test -race
        run: go test -race ./... -count=1
      # The policy assertions about this component's own source. They came from
      # the gateway's suite when this was a subdirectory of it; running them here
      # is what makes them this component's to keep passing.
      - name: Policy assertions
        run: bash tests/test_sidecar_policy.sh
